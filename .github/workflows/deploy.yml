name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "*.md"

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to check out code

env:
  AWS_REGION: us-east-2
  ECR_REPO: fleetstream-app
  ECS_CLUSTER: fleetstream-cluster
  ECS_SERVICE: fleetstream-svc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::061166140701:role/Githubaction-OIDC-pipeline
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:${{ github.sha }} -t $REGISTRY/$ECR_REPO:latest .
          docker push $REGISTRY/$ECR_REPO:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPO:latest

      - name: Roll out to ECS
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE